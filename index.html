<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f5"><title>ちょこmoca | 写メ日記アシスタント</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#653c50;background:#fff7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:20px 16px 70px}.hero{background:linear-gradient(135deg,#ffdce9,#fff4f8);border-radius:24px;padding:24px 20px;margin-bottom:18px;box-shadow:0 8px 30px #d76d9620}.brand{font-size:14px;letter-spacing:2px;color:#bf5a85;font-weight:800}.hero h1{font-size:25px;margin:8px 0}.hero p{margin:0;font-size:13px;line-height:1.7}.card{background:white;border:1px solid #f4dce5;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #ad4b7110}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #e8c9d6;border-radius:12px;padding:12px;font:inherit;font-size:15px;background:#fffafd;color:#5d3446}textarea{min-height:100px;resize:vertical}button{cursor:pointer;font:inherit;border:0;border-radius:13px;padding:13px 15px;font-weight:700}.primary{background:#d85c90;color:white;width:100%;margin-top:12px}.secondary{background:#ffe5ee;color:#ad4774}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{min-height:86px;text-align:left;background:#fff1f6;border:2px solid transparent;color:#8b4563}.mode.active{border-color:#d85c90;background:#ffe2ed}.mode span{display:block;font-size:23px;margin-bottom:7px}.small{font-size:12px;color:#966c80;line-height:1.7}.status{font-size:12px;color:#a14c71;min-height:18px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13px;line-height:1.7;background:#fff6fa;border-radius:12px;padding:14px;max-height:300px;overflow:auto}footer{text-align:center;font-size:11px;color:#ac8799;margin-top:30px}a{color:#b64878}</style></head><body><main class="wrap"><section class="hero"><div class="brand">choco moca ♡</div><h1>写メ日記 AIアシスタント 💗</h1><p>あなたらしい文章を、もっと簡単に。<br>まずはプロフィールを登録してね♡</p></section><section class="card"><h2>🌷 あなたのプロフィール</h2><label for="name">源氏名</label><input id="name" placeholder="例：るり"><label for="personality">性格・雰囲気</label><input id="personality" placeholder="例：人見知りだけど仲良くなると甘えん坊"><label for="tone">文章の雰囲気</label><select id="tone"><option>自然体・親しみやすい</option><option>可愛い・甘め</option><option>清楚・丁寧</option><option>ギャル・明るめ</option><option>大人っぽい・落ち着いた</option></select><label for="emoji">好きな絵文字・口癖</label><input id="emoji" placeholder="例：🥺💕、だよ〜"><label for="likes">趣味・好きな話題</label><input id="likes" placeholder="例：カフェ、アニメ、犬"><label for="avoid">避けたい言葉・話題</label><input id="avoid" placeholder="例：ポエム調、過剰な営業"><button class="secondary" id="save">プロフィールを保存 ♡</button><div id="saved" class="status"></div><p class="small">※プロフィールはこの端末のブラウザ内に保存されます。共有端末では使わないでください。</p></section><section class="card"><h2>✨ 今日は何を作る？</h2><div class="grid" id="modes"></div></section><section class="card"><h2 id="formTitle">📝 通常写メ日記</h2><p class="small" id="hint">今日の出来事や書きたい内容を入力してね。</p><label for="keywords">キーワード・出来事</label><textarea id="keywords" placeholder="例：今日はカフェでいちごパフェ食べた！甘くて幸せだった"></textarea><label for="extra">追加の希望（任意）</label><input id="extra" placeholder="例：短め、絵文字多め、タイトルは可愛く"><button class="primary" id="build">文章作成用の指示を作る ♡</button><div id="outputArea" class="hidden"><label>ChatGPTに渡す文章</label><pre id="output"></pre><div class="actions"><button class="secondary" id="copy">📋 コピー</button><button class="secondary" id="open">ChatGPTを開く ↗</button></div><p class="small">コピーした文章をChatGPTに貼り付けて送信してください。アプリ内でAI生成する機能は、今後の追加予定です。</p></div><div class="status" id="message"></div></section><footer>choco moca ♡ prototype v1.0<br>文章は投稿前に必ず本人が確認してください。</footer></main><script>const $=id=>document.getElementById(id);const fields=['name','personality','tone','emoji','likes','avoid'];const modes=[['通常写メ日記','📝','今日の出来事や書きたい内容を入力してね。'],['限定写メ日記','🔐','限定公開で見せたい一面や写真の内容を入力してね。'],['お礼日記','💌','実際にあったこと・嬉しかったことを単語で入力してね。'],['オキニトーク返信','💬','相手のメッセージと返信したい内容を入力してね。'],['1日3本まとめ作成','📅','今日の出来事や使える話題を入力してね。'],['ネタ・タイトル提案','💡','趣味・季節・希望するテーマなどを入力してね。'],['日記の添削','✏️','自分で書いた日記を貼り付けてね。'],['キャラクター設定','👩','変更したい雰囲気や特徴を入力してね。']];let current=0;try{const p=JSON.parse(localStorage.getItem('chocomoca-profile')||'{}');fields.forEach(k=>{if(p[k])$(k).value=p[k]})}catch(e){}$('save').onclick=()=>{try{localStorage.setItem('chocomoca-profile',JSON.stringify(Object.fromEntries(fields.map(k=>[k,$(k).value]))));$('saved').textContent='保存しました♡'}catch(e){$('saved').textContent='保存できませんでした。ブラウザの設定をご確認ください。'}};function render(){ $('modes').innerHTML='';modes.forEach((m,i)=>{let b=document.createElement('button');b.className='mode'+(i===current?' active':'');b.innerHTML='<span>'+m[1]+'</span>'+m[0];b.onclick=()=>{current=i;render();$('outputArea').classList.add('hidden');$('message').textContent=''};$('modes').appendChild(b)});$('formTitle').textContent=modes[current][1]+' '+modes[current][0];$('hint').textContent=modes[current][2]}render();const rules=`あなたは女性スタッフ向けの文章作成アシスタントです。本人がスマホで書いたような自然な日本語にしてください。抽象的なAI表現、同じ構成の繰り返し、しつこい営業を避けてください。架空の体験・会話・感情・予約状況は作らず、顧客や本人の特定につながる情報、具体的な性的サービスの描写は入れないでください。スマホで読みやすく改行し、完成文には短いタイトルを付けてください。`;const tasks=[`通常写メ日記を100〜180字で3パターン（自然体／可愛い／興味を引く）作ってください。`,`限定写メ日記を80〜150字で3パターン（プライベート感／ギャップ／特別感）作ってください。`,`お礼日記を100〜180字を目安に3パターン作ってください。材料が少ない場合は短くし、架空の出来事を足さないでください。`,`オキニトークの返信を3パターン（自然体／可愛い／会話が続く）作ってください。相手との距離感を守ってください。`,`内容の異なる写メ日記を3本（日常／魅力／気遣い）作ってください。同じ言い回しや絵文字を繰り返さないでください。`,`投稿ネタとタイトルを10組提案してください。季節や本人の趣味を考慮してください。`,`元の文章を自然さ・本人らしさ・読者の興味・親近感・プライバシーの5項目で評価し、元の雰囲気を残した改善版と構成を改善した版を作ってください。`,`入力をもとにキャラクター設定カードを更新・作成してください。事実を推測せず、不明点は未設定としてください。`];$('build').onclick=()=>{let profile=fields.map(k=>({name:'源氏名',personality:'性格',tone:'文体',emoji:'絵文字・口癖',likes:'趣味',avoid:'避けたい表現'})[k]+'：'+($(k).value||'未設定')).join('\n');let input=$('keywords').value.trim();if(!input){$('message').textContent='キーワードや文章を入力してね♡';return}let text=`【ちょこmoca 写メ日記アシスタント】\n\n【本人の設定】\n${profile}\n\n【依頼】\n${tasks[current]}\n\n【入力内容】\n${input}\n\n【追加希望】\n${$('extra').value||'なし'}\n\n【共通ルール】\n${rules}\n\n説明は最小限にし、すぐ使える文章を提示してください。`; $('output').textContent=text;$('outputArea').classList.remove('hidden');$('message').textContent='指示ができました！コピーしてChatGPTに貼り付けてね♡'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').textContent);$('message').textContent='コピーしました♡'}catch(e){const r=document.createRange();r.selectNodeContents($('output'));getSelection().removeAllRanges();getSelection().addRange(r);$('message').textContent='文章を選択しました。コピーしてください。'}};$('open').onclick=()=>window.open('https://chatgpt.com/','_blank','noopener,noreferrer');</script></body></html>
